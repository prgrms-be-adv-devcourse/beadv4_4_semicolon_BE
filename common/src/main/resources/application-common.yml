spring:
  profiles:
      active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_HIKARI_MINIMUM_IDLE:1}
      maximum-pool-size: ${DB_HIKARI_MAXIMUM_POOL_SIZE:10}
      idle-timeout: ${DB_HIKARI_IDLE_TIMEOUT:30000}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${DB_HIKARI_MAX_LIFETIME:1800000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true              # 부하 테스트 시 반드시 false
        format_sql: false
        use_sql_comments: false

        hbm2ddl:
          auto: ${HIBERNATE_DDL_AUTO:update}

        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul
    serialization:
      fail-on-empty-beans: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      retries: 3
      properties:
        linger.ms: 100
        batch.size: 16384
        interceptor.classes: dukku.common.global.logging.kafka.KafkaTracingProducerInterceptor
    consumer:
      group-id: ${spring.application.name}-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        interceptor.classes: dukku.common.global.logging.KafkaTracingConsumerInterceptor

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs
    operations-sorter: method

jwt:
  access:
    secret:
      key: ${JWT_ACCESS_SECRET}
  refresh:
    secret:
      key: ${JWT_REFRESH_SECRET}

crypto:
  key: ${CRYPTO_KEY}

custom:
  global:
    internalBackUrl: ${INTERNAL_BACK_URL:http://localhost}
  client:
    user:
      url: ${CUSTOM_CLIENT_USER_URL:${custom.global.internalBackUrl}}
    product:
      url: ${CUSTOM_CLIENT_PRODUCT_URL:${custom.global.internalBackUrl}}
    settlement:
      url: ${CUSTOM_CLIENT_SETTLEMENT_URL:${custom.global.internalBackUrl}}
    order:
      url: ${CUSTOM_CLIENT_ORDER_URL:${custom.global.internalBackUrl}}
    payment:
      url: ${CUSTOM_CLIENT_PAYMENT_URL:${custom.global.internalBackUrl}}
    coupon:
      url: ${CUSTOM_CLIENT_COUPON_URL:${custom.global.internalBackUrl}}
    deposit:
      url: ${CUSTOM_CLIENT_DEPOSIT_URL:${custom.global.internalBackUrl}}
    ai:
      url: ${CUSTOM_CLIENT_AI_URL:${custom.global.internalBackUrl}}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,https://localhost,http://127.0.0.1,https://127.0.0.1,http://localhost:3000,https://localhost:3000,http://127.0.0.1:3000,https://127.0.0.1:3000,http://localhost:5173,https://localhost:5173,http://127.0.0.1:5173,https://127.0.0.1:5173}

