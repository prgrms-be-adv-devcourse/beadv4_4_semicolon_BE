name: Deploy to k3s (EC2)

on:
  pull_request:
    branches: [ "dev" ]
  push:
    branches: [ "dev" ]
  workflow_dispatch:

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
  EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
  K8S_NAMESPACE: semicolon

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ai는 일단 제외 (나중에 mongodb 포함해서 붙일 때 추가)
        module: [ auth, user, product, order, coupon, payment, deposit, settlement ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push (sha)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/semicolon-${{ matrix.module }}:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/semicolon-${{ matrix.module }}:latest
          build-args: |
            MODULE_NAME=${{ matrix.module }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 (k3s) via SSH - set image by sha
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USERNAME }}
          key: ${{ env.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            NS="${{ env.K8S_NAMESPACE }}"
            SHA="${{ github.sha }}"
            DOCKER_USERNAME="${{ env.DOCKER_USERNAME }}"

            # k3s 환경이면 sudo가 필요할 수 있음
            K="kubectl"
            if ! kubectl version --client >/dev/null 2>&1; then
              K="sudo kubectl"
            fi

            echo "[1] cluster check"
            $K -n "$NS" get deploy

            echo "[2] rollout: set images by sha"
            for m in auth user product order coupon payment deposit settlement; do
              img="${DOCKER_USERNAME}/semicolon-${m}:${SHA}"
              echo " - deploy/${m} -> ${img}"
              $K -n "$NS" set image "deploy/${m}" "${m}=${img}" --record=true
            done

            echo "[3] wait rollout status"
            for m in auth user product order coupon payment deposit settlement; do
              $K -n "$NS" rollout status "deploy/${m}" --timeout=180s
            done

            echo "[4] result"
            $K -n "$NS" get deploy -o wide
