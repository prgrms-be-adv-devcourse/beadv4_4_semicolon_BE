name: PR Build & Test

on:
  pull_request:
    branches: [ "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ auth, user, product, order, coupon, payment, deposit, settlement, ai ]

    env:
      SPRING_PROFILES_ACTIVE: release
      SYSTEM_DEPOSIT_PASSWORD: ${{ secrets.SYSTEM_DEPOSIT_PASSWORD }}

      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: semicolon
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSLMODE: disable

      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_ELASTICSEARCH_URIS: http://localhost:9200

      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      CRYPTO_KEY: ${{ secrets.CRYPTO_KEY }}
      TOSS_API_SECRET_KEY: ${{ secrets.TOSS_API_SECRET_KEY }}
      CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      AWS_ACCESS_KEY: ${{secrets.AWS_ACCESS_KEY}}
      AWS_SECRET_KEY: ${{secrets.AWS_SECRET_KEY}}
      AWS_REGION: ${{secrets.AWS_REGION}}
      AWS_S3_BUCKET: ${{secrets.AWS_S3_BUCKET}}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Create docker-compose.ci.yml
        run: |
          cat <<'EOF' > docker-compose.ci.yml
          version: "3.8"
          services:
            elasticsearch:
              image: docker.elastic.co/elasticsearch/elasticsearch:9.2.2
              environment:
                - discovery.type=single-node
                - xpack.security.enabled=false
                - ES_JAVA_OPTS=-Xms512m -Xmx512m
              ports:
                - "9200:9200"
              command: >
                /bin/sh -c "
                  if ! ./bin/elasticsearch-plugin list | grep -q analysis-nori; then
                    ./bin/elasticsearch-plugin install analysis-nori;
                  fi;
                  /usr/local/bin/docker-entrypoint.sh elasticsearch
                "

            redis:
              image: redis:7.2
              ports:
                - "6379:6379"

            postgres:
              image: pgvector/pgvector:pg18
              environment:
                POSTGRES_DB: semicolon
                POSTGRES_USER: ${DB_USERNAME}
                POSTGRES_PASSWORD: ${DB_PASSWORD}
              ports:
                - "5432:5432"
          EOF

      - name: Start Containers (ES, Redis, Postgres)
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for Elasticsearch..."
          timeout 90s bash -c 'until curl -s http://localhost:9200 >/dev/null; do sleep 5; done'
          echo "Elasticsearch is up!"

          echo "Waiting for Postgres..."
          timeout 60s bash -c 'until docker exec $(docker ps -qf "ancestor=pgvector/pgvector:pg18") pg_isready -U "${{ secrets.DB_USERNAME }}" >/dev/null 2>&1; do sleep 3; done'
          echo "Postgres is ready!"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ 모듈별 ApplicationTests 경로를 매핑
      - name: Set test class for module
        id: testclass
        run: |
          case "${{ matrix.module }}" in
            auth) echo "TEST_CLASS=dukku.auth.ApplicationTests" >> $GITHUB_ENV ;;
            user) echo "TEST_CLASS=dukku.user.ApplicationTests" >> $GITHUB_ENV ;;
            product) echo "TEST_CLASS=dukku.product.ApplicationTests" >> $GITHUB_ENV ;;
            order) echo "TEST_CLASS=dukku.order.ApplicationTests" >> $GITHUB_ENV ;;
            coupon) echo "TEST_CLASS=dukku.coupon.ApplicationTests" >> $GITHUB_ENV ;;
            payment) echo "TEST_CLASS=dukku.payment.ApplicationTests" >> $GITHUB_ENV ;;
            deposit) echo "TEST_CLASS=dukku.deposit.ApplicationTests" >> $GITHUB_ENV ;;
            settlement) echo "TEST_CLASS=dukku.settlement.ApplicationTests" >> $GITHUB_ENV ;;
            ai) echo "TEST_CLASS=dukku.ai.ApplicationTests" >> $GITHUB_ENV ;;
            *) echo "Unknown module"; exit 1 ;;
          esac

      - name: Build and Test (Application Startup Only)
        run: ./gradlew clean :${{ matrix.module }}:test --tests "${TEST_CLASS}" --no-daemon --info

      - name: Print Container Logs on Failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs
