version: '3.8'

services:
  # === Microservices ===
  auth:
    image: ${DOCKER_IMAGE_PREFIX:-dukku}/semicolon-auth:latest
    container_name: semicolon-auth
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=auth_service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CRYPTO_KEY=${CRYPTO_KEY}
    networks:
      - team05-network
    deploy:
      resources:
        limits:
          memory: 512M

  user:
    image: ${DOCKER_IMAGE_PREFIX:-dukku}/semicolon-user:latest
    container_name: semicolon-user
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=user_service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CRYPTO_KEY=${CRYPTO_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - EMAIL_VERIFICATION_BASE_URL=${EMAIL_VERIFICATION_BASE_URL}
    networks:
      - team05-network
    deploy:
      resources:
        limits:
          memory: 512M

  product:
    image: ${DOCKER_IMAGE_PREFIX:-dukku}/semicolon-product:latest
    container_name: semicolon-product
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=product_service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - ELASTICSEARCH_URIS=${ELASTICSEARCH_URIS}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CRYPTO_KEY=${CRYPTO_KEY}
      - SPRING_ELASTICSEARCH_URIS=${ELASTICSEARCH_URIS}
    networks:
      - team05-network
    deploy:
      resources:
        limits:
          memory: 512M

  order:
    image: ${DOCKER_IMAGE_PREFIX:-dukku}/semicolon-order:latest
    container_name: semicolon-order
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=order_service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CRYPTO_KEY=${CRYPTO_KEY}
    networks:
      - team05-network
    deploy:
      resources:
        limits:
          memory: 512M

  coupon:
    image: ${DOCKER_IMAGE_PREFIX:-dukku}/semicolon-coupon:latest
    container_name: semicolon-coupon
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=coupon_service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CRYPTO_KEY=${CRYPTO_KEY}
    networks:
      - team05-network
    deploy:
      resources:
        limits:
          memory: 512M

  payment:
    image: ${DOCKER_IMAGE_PREFIX:-dukku}/semicolon-payment:latest
    container_name: semicolon-payment
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=payment_service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - TOSS_API_SECRET_KEY=${TOSS_API_SECRET_KEY}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CRYPTO_KEY=${CRYPTO_KEY}
    networks:
      - team05-network
    deploy:
      resources:
        limits:
          memory: 512M

  deposit:
    image: ${DOCKER_IMAGE_PREFIX:-dukku}/semicolon-deposit:latest
    container_name: semicolon-deposit
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=deposit_service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SYSTEM_DEPOSIT_PASSWORD=${SYSTEM_DEPOSIT_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CRYPTO_KEY=${CRYPTO_KEY}
    networks:
      - team05-network
    deploy:
      resources:
        limits:
          memory: 512M

  settlement:
    image: ${DOCKER_IMAGE_PREFIX:-dukku}/semicolon-settlement:latest
    container_name: semicolon-settlement
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=settlement_service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CRYPTO_KEY=${CRYPTO_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL_SETTLEMENT}
    networks:
      - team05-network
    deploy:
      resources:
        limits:
          memory: 512M

  ai:
    image: ${DOCKER_IMAGE_PREFIX:-dukku}/semicolon-ai:latest
    container_name: semicolon-ai
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=ai_service
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CRYPTO_KEY=${CRYPTO_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - team05-network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  team05-network:
    external: true
