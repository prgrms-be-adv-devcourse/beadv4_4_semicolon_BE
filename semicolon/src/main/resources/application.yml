spring:
  application:
    name: semicolon
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_service}?sslmode=${DB_SSLMODE:disable}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 30
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: create
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100

  jackson:
    time-zone: Asia/Seoul
    serialization:
      fail-on-empty-beans: false

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false # 애플리케이션 시작 시 자동 실행 방지

  elasticsearch:
    uris: http://localhost:9200
    #Uris: http://team05-elasticsearch:9200  # ES 서버 주소
    socket-timeout: 30s
    connection-timeout: 5s

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:} # 실제 이메일 인증
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

batch:
  settlement:
    chunk-size: 100
    fee-rate: 0.05
    skip-limit: 10
    retry-limit: 3
    page-size: 100
    scheduler:
      enabled: true
      cron: "0 0 2 1 * *" # 매월 1일 오전 2시 실행

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs
    operations-sorter: method

server:
  forward-headers-strategy: framework

redis:
  product:
    view:
      prefix: "product:view:"
      dirty-key: "product:view:dirty"

custom:
  email:
    verification:
      required: true
      base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:8080}
      token-ttl-seconds: ${EMAIL_VERIFICATION_TOKEN_TTL_SECONDS:1800}
      verified-ttl-seconds: ${EMAIL_VERIFICATION_VERIFIED_TTL_SECONDS:1800}
  user:
    withdrawal:
      restore-days: 30
      purge-days: 90
      purge-cron: "0 0 3 * * *"
      mask-domain: "withdrawn.invalid"

# 시스템 예치금 계정 설정
system:
  admin-deposit:
    password: ${SYSTEM_DEPOSIT_PASSWORD}
