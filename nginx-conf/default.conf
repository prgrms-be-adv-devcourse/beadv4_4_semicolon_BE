# ========================
# HTTP 리버스 프록시 (80)
# ========================

# WebSocket 업그레이드 헤더 처리용 변수
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost api.dukku.shop;
    # Docker 내부 DNS 사용
    resolver 127.0.0.11 ipv6=off valid=10s;

    # 공통 프록시 헤더
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # ===== 인증(Auth) =====
    location /api/v1/auth {
        set $auth_upstream host.docker.internal:8081;
        proxy_pass http://$auth_upstream;
    }

    # ===== OAuth2 소셜 로그인 (Spring Security) =====
    location /oauth2/ {
        set $auth_upstream host.docker.internal:8081;
        proxy_pass http://$auth_upstream;
    }

    location /login/oauth2/ {
        set $auth_upstream host.docker.internal:8081;
        proxy_pass http://$auth_upstream;
    }

    # ===== 사용자(User) =====
    location /api/v1/users { set $user_upstream host.docker.internal:8082; proxy_pass http://$user_upstream; }
    location /api/v1/admin/users { set $user_upstream host.docker.internal:8082; proxy_pass http://$user_upstream; }
    location /api/v1/internal/users { set $user_upstream host.docker.internal:8082; proxy_pass http://$user_upstream; }

    # ===== 상품(Product) =====
    location /api/v1/products { set $product_upstream host.docker.internal:8083; proxy_pass http://$product_upstream; }
    location /api/v1/categories { set $product_upstream host.docker.internal:8083; proxy_pass http://$product_upstream; }
    location /api/v1/sellers { set $product_upstream host.docker.internal:8083; proxy_pass http://$product_upstream; }
    location /api/v1/seller/products { set $product_upstream host.docker.internal:8083; proxy_pass http://$product_upstream; }
    location /api/v1/carts { set $product_upstream host.docker.internal:8083; proxy_pass http://$product_upstream; }
    location /api/v1/shops { set $product_upstream host.docker.internal:8083; proxy_pass http://$product_upstream; }
    location /api/v1/seller-reviews { set $product_upstream host.docker.internal:8083; proxy_pass http://$product_upstream; }
    location /api/v1/admin/products { set $product_upstream host.docker.internal:8083; proxy_pass http://$product_upstream; }

    # ===== 주문(Order) =====
    location /api/v1/orders { set $order_upstream host.docker.internal:8084; proxy_pass http://$order_upstream; }
    location /api/v1/admin/orders { set $order_upstream host.docker.internal:8084; proxy_pass http://$order_upstream; }
    location /api/v1/internal/orders { set $order_upstream host.docker.internal:8084; proxy_pass http://$order_upstream; }
    location /api/v1/returns { set $order_upstream host.docker.internal:8084; proxy_pass http://$order_upstream; }

    # ===== 결제(Payment) =====
    location /api/v1/payments { set $payment_upstream host.docker.internal:8086; proxy_pass http://$payment_upstream; }
    location /api/v1/admin/payments { set $payment_upstream host.docker.internal:8086; proxy_pass http://$payment_upstream; }
    location /api/v1/internal/payments { set $payment_upstream host.docker.internal:8086; proxy_pass http://$payment_upstream; }

    # ===== 쿠폰(Coupon) =====
    location /api/v1/coupons { set $coupon_upstream host.docker.internal:8085; proxy_pass http://$coupon_upstream; }
    location /api/v1/admin/coupons { set $coupon_upstream host.docker.internal:8085; proxy_pass http://$coupon_upstream; }

    # ===== 예치금(Deposit) =====
    location /api/v1/deposits { set $deposit_upstream host.docker.internal:8087; proxy_pass http://$deposit_upstream; }
    location /api/v1/admin/deposits { set $deposit_upstream host.docker.internal:8087; proxy_pass http://$deposit_upstream; }
    location /api/v1/internal/deposits { set $deposit_upstream host.docker.internal:8087; proxy_pass http://$deposit_upstream; }

    # ===== 정산(Settlement) =====
    location /api/v1/settlements { set $settlement_upstream host.docker.internal:8088; proxy_pass http://$settlement_upstream; }
    location /api/v1/admin/settlements { set $settlement_upstream host.docker.internal:8088; proxy_pass http://$settlement_upstream; }

    # 프론트엔드 (호스트의 Vite dev 서버: 3000)
    location / {
        set $frontend_upstream host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_pass https://$frontend_upstream;
    }
}

# ========================
# HTTPS 리버스 프록시 (443)
# ========================

server {
    listen 443 ssl;
    server_name localhost api.dukku.shop;

    # 로컬 TLS 인증서 경로
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Docker 내부 DNS 사용
    resolver 127.0.0.11 ipv6=off valid=10s;

    # 공통 프록시 헤더
    proxy_set_header Host $host;
