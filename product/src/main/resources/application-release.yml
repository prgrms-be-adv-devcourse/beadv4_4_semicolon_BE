spring:
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/product

  jpa:
    hibernate:
      ddl-auto: validate

product:
  init:
    enabled: false
    clear-es-on-startup: false
  reindex-on-startup: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  access:
    secret:
      key: ${JWT_ACCESS_SECRET}

crypto:
  key: ${CRYPTO_KEY}

custom:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,https://localhost,http://localhost:3000,https://localhost:3000,http://127.0.0.1,https://127.0.0.1,http://127.0.0.1:3000,https://127.0.0.1:3000}

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}
